<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        /* 스크롤 높이를 확보하기 위한 컨테이너 */
        .scroll-container {
            height: 12000vh; /* 스크롤 속도를 조절하고 싶다면 이 값을 변경하세요 (예: 400vh, 600vh) */
        }
        /* 화면 중앙에 캔버스를 고정 */
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="scroll-container"></div>
    <div class="canvas-container">
        <canvas id="hero-lightpass"></canvas>
    </div>

    <script>
        const html = document.documentElement;
        const canvas = document.getElementById("hero-lightpass");
        const context = canvas.getContext("2d");

        // 프레임 설정 (000000 ~ 001517, 총 1518장)
        const frameCount = 1518;
        const currentFrame = index => (
            `./frame-${index.toString().padStart(6, '0')}.jpg`
        );

        // 이미지 객체 배열 사전 생성
        const images = [];
        const airpods = {
            frame: 0
        };

        // 이미지 미리 로드
        for (let i = 0; i < frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            images.push(img);
        }

        // 캔버스 크기 지정 및 첫 프레임 렌더링
        const img = new Image();
        img.src = currentFrame(0);
        canvas.width = 1920;
        canvas.height = 1080;
        
        img.onload = function() {
            context.drawImage(img, 0, 0);
        };

        // 캔버스 드로잉 함수
        const updateImage = index => {
            if (images[index] && images[index].complete) {
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.drawImage(images[index], 0, 0);
            }
        };

        // 스크롤 연동 로직
        window.addEventListener('scroll', () => {
            const scrollTop = html.scrollTop || document.body.scrollTop;
            const maxScrollTop = html.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            
            const frameIndex = Math.min(
                frameCount - 1,
                Math.ceil(scrollFraction * frameCount)
            );
            
            requestAnimationFrame(() => updateImage(frameIndex));
        });
    </script>
</body>
</html>
